// ============================================================
// EJECUCIÓN AUTOMÁTICA DE RECUPERACIÓN
// ============================================================
function addLog(msg, type = '') {
    const log = document.getElementById('statusLog');
    const div = document.createElement('div');
    div.className = 'status-line ' + type;
    div.textContent = msg;
    log.appendChild(div);
}

function setProgress(pct) {
    document.getElementById('progressFill').style.width = pct + '%';
}

function setCount(n) {
    document.getElementById('sprintCount').textContent = n;
}

async function runRecovery() {
    try {
        addLog('⏳ Validando estructura de datos...');
        await sleep(400);

        if (!Array.isArray(RECOVERED_SPRINTS) || RECOVERED_SPRINTS.length === 0) {
            throw new Error('Datos de recuperación inválidos');
        }
        addLog('✅ Datos válidos: ' + RECOVERED_SPRINTS.length + ' sprints encontrados', 'ok');
        setProgress(20);
        await sleep(400);

        // Limpiar datos viejos
        addLog('🗑️  Limpiando datos anteriores...');
        localStorage.removeItem('scrumSprints');
        localStorage.removeItem('scrumSprints_backup');
        await sleep(300);
        setProgress(40);

        // Guardar datos recuperados
        addLog('💾 Guardando sprints en localStorage...');
        const dataStr = JSON.stringify(RECOVERED_SPRINTS);
        localStorage.setItem('scrumSprints', dataStr);
        localStorage.setItem('scrumSprints_backup', dataStr);
        await sleep(400);
        setProgress(70);

        // Verificar
        const verify = JSON.parse(localStorage.getItem('scrumSprints'));
        if (!verify || verify.length !== RECOVERED_SPRINTS.length) {
            throw new Error('Verificación fallida - datos no guardados correctamente');
        }

        setProgress(90);
        await sleep(300);

        // Contar y mostrar sprints
        let count = 0;
        for (let i = 0; i < RECOVERED_SPRINTS.length; i++) {
            count++;
            setCount(count);
            await sleep(60);
        }

        setProgress(100);
        addLog('✅ ¡' + RECOVERED_SPRINTS.length + ' sprints recuperados exitosamente!', 'ok');
        addLog('🚀 Redirigiendo a Scrum Platform...', 'ok');

        // Habilitar botón y redirigir automáticamente
        document.getElementById('goBtn').disabled = false;
        await sleep(1200);
        window.location.href = 'index.html';

    } catch (err) {
        addLog('❌ Error: ' + err.message, 'error');
        document.getElementById('goBtn').disabled = false;
        document.getElementById('goBtn').textContent = '🔄 Intentar de nuevo';
        document.getElementById('goBtn').onclick = () => location.reload();
    }
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Ejecutar al cargar
window.onload = runRecovery;
